<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Morning Mavericks Cricket Club</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial;
            background-color: #f4f6f8;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            border-radius: 12px;
            padding: 25px;
            max-width: 600px;
            margin: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            color: #2c3e50;
        }
        .logo {
            text-align: center;
            font-size: 40px;
        }
        .content {
            margin-top: 20px;
            font-size: 16px;
            color: #333;
        }
        .highlight {
            color: #27ae60;
            font-weight: bold;
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            text-align: center;
            color: #888;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            background: #27ae60;
            color: white;
            border-radius: 5px;
            text-decoration: none;
            margin-top: 15px;
        }
    </style>
</head>
<body style="font-family: Arial; background:#f4f6f8; padding:20px;">

<div style="background:white; padding:20px; border-radius:10px; text-align:center;">
    <h2>🎉 Happy Birthday 🎂</h2>
    <p>Hello <b th:text="${name}"></b>,</p>
    <p>🏏 Wishing you a fantastic birthday from <b>Morning Mavericks Cricket Club</b>!</p>
    <p>May your year be filled with:</p>
    <p>🏆 More runs<br/>
        💪 Great fitness<br/>
        🎯 Winning matches</p>
    <h3 style="color:#27ae60;">Enjoy your special day! 🎊</h3>
    <p>See you on the turf soon! 🏏</p>

</div>

<div class="footer">
    <p><b>Morning Mavericks Cricket Club</b></p>
    <p>"Where Every Match Matters"</p>
</div>

</body>
</html>
