server:
  port: 9090

spring:
  data:
    mongodb:
      host: localhost
      port: 27017
      database: test
  application:
    name: turf-management

logging:
  level:
    root: INFO
    org.springframework.data.mongodb: DEBUG
    org.mongodb.driver: DEBUG
    org.springframework.web: DEBUG
    com.turf.turf_management: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"

jwt:
  secret: mysupersecuresecretkeymysecretkey1234567890
  expiration: 86400000